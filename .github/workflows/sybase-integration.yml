name: Sybase Integration (manual)

# Not run on push/PR — upstream has no SAP ASE license for required CI.
# Forks or maintainers WITH a license: workflow_dispatch + secret SYBASE_LICENSE_B64
# (base64 license.dat) to run live tests/Sybase. Without the secret, only unit capability tests run.

on:
  workflow_dispatch:

jobs:
  sybase-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sybase CI scope
        run: |
          echo "::notice title=Sybase::Not part of upstream push/PR CI (no SAP license)."
          echo "::notice::To run live ASE tests here, set repo secret SYBASE_LICENSE_B64 and re-run this workflow."

      - name: Install FreeTDS
        run: sudo apt-get update && sudo apt-get install -y freetds-common freetds-dev

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_dblib
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run architecture guardrails
        run: composer check

      - name: Start Sybase ASE
        if: ${{ secrets.SYBASE_LICENSE_B64 != '' }}
        env:
          SYBASE_LICENSE_B64: ${{ secrets.SYBASE_LICENSE_B64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 /tmp/sybase-licenses
          printf '%s' "$SYBASE_LICENSE_B64" | base64 -d > /tmp/sybase-licenses/license.dat
          docker run -d --name uda-sybase-ci \
            -p 127.0.0.1:5000:5000 \
            -v /tmp/sybase-licenses:/usr/local/flexlm/licenses:ro \
            -e SA_PASSWORD=Sybase_UDA_CI1 \
            -e DATABASE=master \
            superbeeeeeee/docker-sybase:latest
          for attempt in $(seq 1 60); do
            if docker exec uda-sybase-ci healthcheck; then
              echo "Sybase ASE is healthy (attempt ${attempt})"
              exit 0
            fi
            sleep 5
          done
          docker logs uda-sybase-ci
          exit 1

      - name: Run Sybase live integration suites
        if: ${{ secrets.SYBASE_LICENSE_B64 != '' }}
        env:
          TDSVER: "7.4"
          UDA_SYBASE_LIVE: "1"
          SYBASE_HOST: 127.0.0.1
          SYBASE_PORT: 5000
          SYBASE_DATABASE: master
          SYBASE_USER: sa
          SYBASE_PASSWORD: Sybase_UDA_CI1
        run: vendor/bin/phpunit --bootstrap tests/sybase-bootstrap.php tests/Sybase

      - name: Sybase capability tests (no license secret)
        if: ${{ secrets.SYBASE_LICENSE_B64 == '' }}
        run: vendor/bin/phpunit tests/Query/SybaseCapabilitiesTest.php

      - name: Reference Sybase integration docs
        run: echo "See docs/integration/sybase.md"
