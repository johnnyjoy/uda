name: SQLite Certification

on:
  push:
  pull_request:

jobs:
  sqlite-cert:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
        options: >-
          --health-cmd "bash -c '(echo >/dev/tcp/127.0.0.1/11211)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: redis, memcached
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run architecture guardrails
        run: composer check
      - name: Run SQLite certification suites
        env:
          SQLITE_REDIS_HOST: 127.0.0.1
          SQLITE_MEMCACHED_HOST: 127.0.0.1
        run: vendor/bin/phpunit tests/SQLite tests/Cache tests/Runtime
      - name: Reference SQLite certification docs
        run: echo "See docs/certification/sqlite.md for details"
