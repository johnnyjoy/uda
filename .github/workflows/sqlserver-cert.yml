name: SQL Server Certification

on:
  push:
  pull_request:

jobs:
  sqlserver-cert:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Your_Str0ng!Passw0rd123
        ports:
          - 1433:1433
        options: >-
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 60s
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Your_Str0ng!Passw0rd123' -Q 'SELECT 1' -b -o /dev/null"

    steps:
      - uses: actions/checkout@v4

      - name: Install FreeTDS
        run: sudo apt-get update && sudo apt-get install -y freetds-common freetds-dev

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_dblib
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run architecture guardrails
        run: composer check

      - name: Run SQL Server certification suites
        env:
          TDSVER: "7.4"
          MSSQL_HOST: 127.0.0.1
          MSSQL_PORT: 1433
          MSSQL_DATABASE: master
          MSSQL_USER: sa
          MSSQL_PASSWORD: Your_Str0ng!Passw0rd123
        run: vendor/bin/phpunit --bootstrap tests/sqlserver-bootstrap.php tests/SqlServer

      - name: Reference SQL Server certification docs
        run: echo "See docs/certification/sqlserver.md for details"
